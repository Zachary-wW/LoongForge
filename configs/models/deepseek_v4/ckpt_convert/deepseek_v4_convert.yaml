hydra:
  searchpath:
    - file://${oc.env:LOONGFORGE_PATH}/configs/models/

defaults:
  - deepseek_v4@module: ???
  - _self_


args:
  common:
    num_layers: ${module.num_layers}
    hidden_size: ${module.hidden_size}
    ffn_hidden_size: ${module.ffn_hidden_size}
    num_attention_heads: ${module.num_attention_heads}
    num_key_value_heads: ${module.num_query_groups}
    vocab_size: ${module.vocab_size_in_config_file}
    num_experts: ${module.num_experts}
    mtp_num_layers: ${module.mtp_num_layers}
  huggingface:
    mtp_layer_id: 43
  mcore:
    untie_embeddings_and_output_weights: true
    add_embedding_padding: true
    transpose_mlp_dense: true
    transpose_query_key_value: true

name_map:
  huggingface:
    word_embeddings: model.embed_tokens
    transformer: model
    layer_prefix: layers
    input_layernorm: input_layernorm
    # ── Q compression (same semantic as V3 MLA) ──
    attention.q_down: self_attn.wq_a
    attention.q_up: self_attn.wq_b
    attention.q_up_layernorm: self_attn.q_norm
    # ── Shared-KV MQA (V4: single wkv replaces V3's kv_a_proj_with_mqa + kv_b_proj) ──
    attention.kv_shared: self_attn.wkv
    attention.kv_shared_layernorm: self_attn.kv_norm
    # ── Grouped output projection (V4: wo_a + wo_b replaces V3's single o_proj) ──
    attention.dense_a: self_attn.wo_a
    attention.dense_b: self_attn.wo_b
    # ── Attention sinks (V4 novel) ──
    attention.sink: self_attn.attn_sink
    # ── CSA compressor (layers with compress_ratio=4) ──
    attention.compressor.kv: self_attn.compressor.wkv
    attention.compressor.gate: self_attn.compressor.wgate
    attention.compressor.norm: self_attn.compressor.norm
    attention.compressor.ape: self_attn.compressor.ape
    # ── Lightning Indexer (CSA layers only, e.g. layer 2, 3, ...) ──
    attention.indexer.wq_b: self_attn.indexer.wq_b
    attention.indexer.weights_proj: self_attn.indexer.weights_proj
    attention.indexer.k_norm: self_attn.indexer.k_norm
    attention.indexer.compressor.kv: self_attn.indexer.compressor.wkv
    attention.indexer.compressor.gate: self_attn.indexer.compressor.wgate
    attention.indexer.compressor.norm: self_attn.indexer.compressor.norm
    attention.indexer.compressor.ape: self_attn.indexer.compressor.ape
    post_attention_layernorm: post_attention_layernorm
    # ── MoE gate (V4: TopKRouter has gate.weight + gate.bias; HashRouter has gate.weight + gate.tid2eid) ──
    moe.gate: ffn.gate
    moe.gate.bias: ffn.gate.bias
    moe.gate.tid2eid: ffn.gate.tid2eid
    moe.expert: ffn.experts
    moe.shared_expert: ffn.shared_experts
    # ── Expert weights: w1=gate_proj, w3=up_proj -> packed gate_up; w2=down_proj ──
    moe.expert_h_to_4h:
      - w1
      - w3
    moe.expert_4h_to_h: w2
    # ── Shared expert: w1=gate_proj, w3=up_proj -> packed gate_up; w2=down_proj ──
    moe.shared_expert_h_to_4h:
      - w1
      - w3
    moe.shared_expert_4h_to_h: w2
    final_layernorm: model.norm
    word_embeddings_for_head: lm_head
    # ── HyperConnection parameters (V4 novel, per-layer) ──
    attention.hc_base: hc_attn_base
    attention.hc_fn: hc_attn_fn
    attention.hc_scale: hc_attn_scale
    mlp.hc_base: hc_ffn_base
    mlp.hc_fn: hc_ffn_fn
    mlp.hc_scale: hc_ffn_scale
    # ── HyperHead (model-level, stream collapse before final norm) ──
    hc_head_base: hc_head_base
    hc_head_fn: hc_head_fn
    hc_head_scale: hc_head_scale
    # ── MTP (DeepSeek style 5A, with V4-specific HC and MoE extensions) ──
    mtp_word_embeddings: mtp.0.emb.tok_emb
    mtp_enorm: mtp.0.enorm
    mtp_hnorm: mtp.0.hnorm
    mtp_eh_proj:
      name: mtp.0.e_proj
      dtype: bf16
    mtp_h_proj: mtp.0.h_proj
    mtp_shared_head_norm: mtp.0.norm
    mtp_shared_head_head: mtp.0.head
    mtp_attention.hc_base: mtp.0.hc_attn_base
    mtp_attention.hc_fn: mtp.0.hc_attn_fn
    mtp_attention.hc_scale: mtp.0.hc_attn_scale
    mlp.hc_mtp_base: mtp.0.hc_ffn_base
    mlp.hc_mtp_fn: mtp.0.hc_ffn_fn
    mlp.hc_mtp_scale: mtp.0.hc_ffn_scale
    mtp_hc_head_base: mtp.0.hc_head_base
    mtp_hc_head_fn: mtp.0.hc_head_fn
    mtp_hc_head_scale: mtp.0.hc_head_scale
    # ── MTP MoE (same structure as main MoE) ──
    mtp_moe.expert: mtp.0.ffn.experts
    mtp_moe.gate: mtp.0.ffn.gate
    mtp_moe.gate.bias: mtp.0.ffn.gate.bias
    mtp_moe.expert_h_to_4h:
      - w1
      - w3
    mtp_moe.expert_4h_to_h: w2
    mtp_moe.shared_expert: mtp.0.ffn.shared_experts
    mtp_moe.shared_expert_h_to_4h:
      - w1
      - w3
    mtp_moe.shared_expert_4h_to_h: w2
  mcore:
    word_embeddings: embedding.word_embeddings
    word_position_embeddings: model.embedding.position_embeddings
    transformer: model
    layer_prefix: decoder.layers
    mtp_layer_prefix: mtp.layers
    input_layernorm: input_layernorm
    # ── Q compression ──
    attention.q_down:
      name: self_attention.linear_q_down_proj
      extra: true
      fp8: true
      fp8_ignore_tp: true
    attention.q_up:
      name: self_attention.linear_q_up_proj
      extra: true
      fp8: true
    attention.q_up_layernorm:
      name: self_attention.linear_q_up_proj
      is_layernorm: true
    # ── Shared-KV MQA ──
    attention.kv_shared:
      name: self_attention.linear_kv_shared_proj
      extra: true
      fp8: true
      fp8_ignore_tp: true
    attention.kv_shared_layernorm:
      name: self_attention.linear_kv_shared_proj
      is_layernorm: true
    # ── Grouped output projection ──
    attention.dense_a:
      name: self_attention.linear_proj_a
      extra: true
      fp8: true
      fp8_ignore_tp: true
    attention.dense_b:
      name: self_attention.linear_proj_b
      extra: true
      fp8: true
    # ── Attention sinks (no TP splitting, model-level parameter) ──
    attention.sink:
      name: self_attention.attention_sink
      is_direct_name: true
      ignore_tp: true
    # ── CSA/HCA compressor ──
    attention.compressor.kv:
      name: self_attention.compressor.linear_wkv
      extra: true
      fp8: true
      fp8_ignore_tp: true
    attention.compressor.gate:
      name: self_attention.compressor.linear_wgate
      extra: true
      fp8: true
      fp8_ignore_tp: true
    attention.compressor.norm:
      name: self_attention.compressor.norm
      extra: true
    attention.compressor.ape:
      name: self_attention.compressor.ape
      is_direct_name: true
      ignore_tp: true
    # ── Lightning Indexer ──
    attention.indexer.wq_b:
      name: self_attention.core_attention.indexer.linear_wq_b
      fp8: true
      extra: true
    attention.indexer.weights_proj:
      name: self_attention.core_attention.indexer.linear_weights_proj
      extra: true
    attention.indexer.k_norm:
      name: self_attention.core_attention.indexer.k_norm
      extra: true
    attention.indexer.compressor.kv:
      name: self_attention.core_attention.indexer.compressor.linear_wkv
      extra: true
      fp8: true
      fp8_ignore_tp: true
    attention.indexer.compressor.gate:
      name: self_attention.core_attention.indexer.compressor.linear_wgate
      extra: true
      fp8: true
      fp8_ignore_tp: true
    attention.indexer.compressor.norm:
      name: self_attention.core_attention.indexer.compressor.norm
      extra: true
    attention.indexer.compressor.ape:
      name: self_attention.core_attention.indexer.compressor.ape
      is_direct_name: true
      ignore_tp: true
    post_attention_layernorm: pre_mlp_layernorm
    # ── MoE ──
    moe.gate:
      name: mlp.router
    moe.gate.bias:
      name: mlp.router.expert_bias
    moe.gate.tid2eid:
      name: mlp.router.tid2eid
      is_direct_name: true
      ignore_tp: true
    moe.expert: mlp.experts.local_experts
    moe.groupedgemm.expert: mlp.experts
    moe.shared_expert: mlp.shared_experts
    moe.expert_h_to_4h:
      name: linear_fc1
      fp8: true
      extra: true
    moe.expert_4h_to_h:
      name: linear_fc2
      fp8: true
      extra: true
    moe.shared_expert_h_to_4h:
      name: mlp.shared_experts.linear_fc1
      extra: true
      fp8: true
    moe.shared_expert_4h_to_h:
      name: mlp.shared_experts.linear_fc2
      extra: true
      fp8: true
    # ── HyperConnection (stored as _extra_state or direct params) ──
    attention.hc_base:
      name: self_attention.hc_base
      is_direct_name: true
      ignore_tp: true
    attention.hc_fn:
      name: self_attention.hc_fn
      is_direct_name: true
      ignore_tp: true
    attention.hc_scale:
      name: self_attention.hc_scale
      is_direct_name: true
      ignore_tp: true
    mlp.hc_base:
      name: mlp.hc_base
      is_direct_name: true
      ignore_tp: true
    mlp.hc_fn:
      name: mlp.hc_fn
      is_direct_name: true
      ignore_tp: true
    mlp.hc_scale:
      name: mlp.hc_scale
      is_direct_name: true
      ignore_tp: true
    # ── HyperHead ──
    hc_head_base:
      name: hc_head_base
      is_direct_name: true
      ignore_tp: true
    hc_head_fn:
      name: hc_head_fn
      is_direct_name: true
      ignore_tp: true
    hc_head_scale:
      name: hc_head_scale
      is_direct_name: true
      ignore_tp: true
    final_layernorm:
      name: decoder.final_layernorm
      extra: true
    word_embeddings_for_head: output_layer
    transformer_tpl: model%d
    # ── MTP ──
    mtp_word_embeddings: embedding.word_embeddings
    mtp_enorm: enorm
    mtp_hnorm: hnorm
    mtp_eh_proj:
      name: eh_proj
      dtype: fp8
    mtp_h_proj:
      name: h_proj
      extra: true
      fp8: true
      fp8_ignore_tp: true
    mtp_shared_head_norm:
      name: final_layernorm
      extra: true
    mtp_shared_head_head: output_head
    mtp_name_prefix_for_layer: transformer_layer
    # ── MTP HC ──
    mtp_attention.hc_base:
      name: mtp.self_attention.hc_base
      is_direct_name: true
      ignore_tp: true
    mtp_attention.hc_fn:
      name: mtp.self_attention.hc_fn
      is_direct_name: true
      ignore_tp: true
    mtp_attention.hc_scale:
      name: mtp.self_attention.hc_scale
      is_direct_name: true
      ignore_tp: true
    mlp.hc_mtp_base:
      name: mlp.hc_base
      is_direct_name: true
      ignore_tp: true
    mlp.hc_mtp_fn:
      name: mlp.hc_fn
      is_direct_name: true
      ignore_tp: true
    mlp.hc_mtp_scale:
      name: mlp.hc_scale
      is_direct_name: true
      ignore_tp: true
    mtp_hc_head_base:
      name: mtp.hc_head_base
      is_direct_name: true
      ignore_tp: true
    mtp_hc_head_fn:
      name: mtp.hc_head_fn
      is_direct_name: true
      ignore_tp: true
    mtp_hc_head_scale:
      name: mtp.hc_head_scale
      is_direct_name: true
      ignore_tp: true
    # ── MTP MoE ──
    mtp_moe.expert: mtp.layers.{layer_id}.mlp.experts.local_experts
    mtp_moe.gate:
      name: mlp.router
    mtp_moe.gate.bias:
      name: mlp.router.expert_bias
    mtp_moe.expert_h_to_4h:
      name: linear_fc1
      fp8: true
      extra: true
    mtp_moe.expert_4h_to_h:
      name: linear_fc2
      fp8: true
      extra: true
    mtp_moe.shared_expert: mtp.layers.{layer_id}.mlp.shared_experts
    mtp_moe.shared_expert_h_to_4h:
      name: mlp.shared_experts.linear_fc1
      extra: true
      fp8: true
    mtp_moe.shared_expert_4h_to_h:
      name: mlp.shared_experts.linear_fc2
      extra: true
      fp8: true

torch_dtype: bfloat16
