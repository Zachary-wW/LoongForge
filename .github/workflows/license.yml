name: License Header

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: license-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  spdx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: github.event_name == 'pull_request'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pre-commit
        if: github.event_name == 'pull_request'
        run: pip install pre-commit

      - name: Skip outside a pull request
        if: github.event_name != 'pull_request'
        run: echo "License diff validation is only applicable to pull requests."

      - name: Compute newly added files
        id: new
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="HEAD~1"
            HEAD="HEAD"
          fi
          # Keep the listing separate from the filter: a failing `git diff` has to
          # fail the step, while `grep` exiting 1 only means the filter emptied
          # the list. Piping them together hid both behind the same `|| true`.
          git diff --name-only --diff-filter=A "$BASE" "$HEAD" \
              -- '*.py' '*.sh' '*.cu' '*.cpp' '*.h' > added_files.txt
          grep -vE '^(third_party|patches)/' added_files.txt > new_files.txt || true
          if [ -s new_files.txt ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi
          echo "--- newly added files ---"
          cat new_files.txt || true

      - name: Run SPDX check
        if: steps.new.outputs.has_files == 'true'
        shell: bash
        run: |
          xargs -a new_files.txt pre-commit run spdx-check --files
