name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch && "$RELEASE_REF" != refs/heads/master ]]; then
            echo "manual releases must be dispatched from master" >&2
            exit 1
          fi
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$EVENT_NAME" == push ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            [[ "$tag_version" == "$package_version" ]] || {
              echo "tag and package versions do not match" >&2
              exit 1
            }
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  package:
    needs: validate
    uses: ./.github/workflows/build.yml

  publish:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  build_test_push_internal:
    needs: [validate, package, publish]
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        needs.package.result == 'success' &&
        (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
      }}
    runs-on: ${{ fromJSON(vars.CI_RELEASE_RUNNER) }}
    timeout-minutes: 360
    environment: iregistry-release
    outputs:
      image_ref: ${{ steps.image_ref.outputs.image_ref }}
      registry_host: ${{ steps.image_ref.outputs.registry_host }}
    env:
      INTERNAL_IMAGE_REPOSITORY: ${{ vars.INTERNAL_IMAGE_REPOSITORY }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: LoongForge
          persist-credentials: false
          submodules: recursive
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1
      - id: image_ref
        name: Resolve internal release image reference
        shell: bash
        env:
          INTERNAL_IMAGE_REPOSITORY: ${{ env.INTERNAL_IMAGE_REPOSITORY }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          source LoongForge/.github/scripts/load_ci_config.sh
          : "${INTERNAL_IMAGE_REPOSITORY:?INTERNAL_IMAGE_REPOSITORY repository variable is required}"
          : "${LOONGFORGE_RELEASE_IMAGE_TAG_PREFIX:?LOONGFORGE_RELEASE_IMAGE_TAG_PREFIX is required}"
          image_ref="${INTERNAL_IMAGE_REPOSITORY}:${LOONGFORGE_RELEASE_IMAGE_TAG_PREFIX}_v${VERSION}_release"
          [[ "$image_ref" =~ ^[A-Za-z0-9._/-]+:[A-Za-z0-9._-]+$ ]]
          # Docker only treats the first component as a registry host when it
          # looks like one; otherwise the image lives on Docker Hub.
          registry_host="${INTERNAL_IMAGE_REPOSITORY%%/*}"
          if [[ "$registry_host" == "$INTERNAL_IMAGE_REPOSITORY" || "$registry_host" != *[.:]* ]]; then
            registry_host=docker.io
          fi
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "registry_host=$registry_host" >> "$GITHUB_OUTPUT"
      - name: Verify Docker storage capacity
        shell: bash
        run: |
          set -euo pipefail
          source LoongForge/.github/scripts/load_ci_config.sh
          LoongForge/.github/scripts/check_docker_storage.sh \
            "${LOONGFORGE_MIN_DOCKER_FREE_GB-250}"
      - id: release_image
        name: Build release image with the trusted image builder
        shell: bash
        env:
          IMAGE_REF: loongforge-release:${{ env.VERSION }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          tree_sha="$(git -C LoongForge rev-parse 'HEAD^{tree}')"
          built_ref="$(LoongForge/.github/scripts/self_runner/build_candidate_image.sh \
            --release \
            --image-ref "$IMAGE_REF" \
            --target auto \
            --sha "$GITHUB_SHA" \
            --tree-sha "$tree_sha" \
            --source "$GITHUB_WORKSPACE/LoongForge")"
          [[ "$built_ref" == "$IMAGE_REF" ]]
          echo "image_ref=$built_ref" >> "$GITHUB_OUTPUT"
      - name: Enforce release image policy
        run: python3 LoongForge/.github/scripts/image_policy.py "${{ steps.release_image.outputs.image_ref }}"
      - name: Run release regression in one container
        shell: bash
        env:
          IMAGE_REF: ${{ steps.release_image.outputs.image_ref }}
        run: |
          set -euo pipefail
          source LoongForge/.github/scripts/load_ci_config.sh
          case "${LOONGFORGE_RELEASE_RUN_REGRESSION:-false}" in
            true)
              LoongForge/.github/scripts/self_runner/run_release_regression.sh \
                --image "$IMAGE_REF" \
                --source "$GITHUB_WORKSPACE/LoongForge" \
                --sha "$GITHUB_SHA" \
                --llm-model deepseek_v2_lite \
                --vla-model pi05_ddp
              ;;
            false)
              echo "Release GPU regression is disabled by runner configuration."
              ;;
            *)
              echo "LOONGFORGE_RELEASE_RUN_REGRESSION must be true or false." >&2
              exit 2
              ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-regression
          path: loongforge-release-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Tag validated image for iregistry
        if: github.event_name == 'push'
        env:
          LOCAL_IMAGE_REF: ${{ steps.release_image.outputs.image_ref }}
          INTERNAL_IMAGE_REF: ${{ steps.image_ref.outputs.image_ref }}
        run: docker tag "$LOCAL_IMAGE_REF" "$INTERNAL_IMAGE_REF"
      - name: Log in to iregistry
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          registry: ${{ steps.image_ref.outputs.registry_host }}
          username: ${{ secrets.IREGISTRY_USERNAME }}
          password: ${{ secrets.IREGISTRY_PASSWORD }}
      - name: Push validated image to iregistry
        if: github.event_name == 'push'
        env:
          INTERNAL_IMAGE_REF: ${{ steps.image_ref.outputs.image_ref }}
        run: docker push "$INTERNAL_IMAGE_REF"
      - name: Remove local release image
        if: always()
        env:
          LOCAL_IMAGE_REF: ${{ steps.release_image.outputs.image_ref }}
          INTERNAL_IMAGE_REF: ${{ steps.image_ref.outputs.image_ref }}
        run: docker image rm -f "$LOCAL_IMAGE_REF" "$INTERNAL_IMAGE_REF" >/dev/null 2>&1 || true

  promote_to_dockerhub:
    needs: [validate, build_test_push_internal]
    if: github.event_name == 'push' && needs.build_test_push_internal.result == 'success'
    runs-on: ${{ fromJSON(vars.CI_DOCKERHUB_PUBLISHER_RUNNER) }}
    timeout-minutes: 30
    environment: dockerhub-release
    env:
      INTERNAL_IMAGE_REF: ${{ needs.build_test_push_internal.outputs.image_ref }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'docker.io/loongforge/loongforge' }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Log in to iregistry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          registry: ${{ needs.build_test_push_internal.outputs.registry_host }}
          username: ${{ secrets.IREGISTRY_PULL_USERNAME }}
          password: ${{ secrets.IREGISTRY_PULL_PASSWORD }}
      - name: Pull validated internal image
        run: docker pull "$INTERNAL_IMAGE_REF"
      - name: Tag image for Docker Hub
        env:
          DOCKERHUB_REF: ${{ env.DOCKERHUB_IMAGE }}:${{ env.VERSION }}
        run: docker tag "$INTERNAL_IMAGE_REF" "$DOCKERHUB_REF"
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push versioned Docker Hub image
        env:
          DOCKERHUB_REF: ${{ env.DOCKERHUB_IMAGE }}:${{ env.VERSION }}
        run: docker push "$DOCKERHUB_REF"
      - name: Verify registry digests match
        env:
          DOCKERHUB_REF: ${{ env.DOCKERHUB_IMAGE }}:${{ env.VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          internal_repo="${INTERNAL_IMAGE_REF%:*}"
          dockerhub_repo="${DOCKERHUB_REF%:*}"
          internal_digest="$(
            docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "$INTERNAL_IMAGE_REF" |
              awk -F@ -v repo="$internal_repo" '$1 == repo { print $2; exit }'
          )"
          docker pull "$DOCKERHUB_REF" >/dev/null
          dockerhub_digest="$(
            docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "$DOCKERHUB_REF" |
              awk -F@ -v repo="$dockerhub_repo" '$1 == repo { print $2; exit }'
          )"
          [[ -n "$internal_digest" && "$internal_digest" == "$dockerhub_digest" ]]
          echo "verified digest: $internal_digest"
      - name: Remove promoted images
        if: always()
        env:
          DOCKERHUB_REF: ${{ env.DOCKERHUB_IMAGE }}:${{ env.VERSION }}
        run: |
          docker image rm -f "$INTERNAL_IMAGE_REF" "$DOCKERHUB_REF" >/dev/null 2>&1 || true
