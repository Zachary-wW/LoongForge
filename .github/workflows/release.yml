name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          [[ "$tag_version" == "$package_version" ]] || {
            echo "tag and package versions do not match" >&2
            exit 1
          }
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  package:
    needs: validate
    uses: ./.github/workflows/build.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  docker:
    needs: [validate, package, publish]
    runs-on: ubuntu-latest
    environment: dockerhub-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: LoongForge
          persist-credentials: false
          submodules: recursive
      - name: Prepare Docker build context
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'LoongForge/.git' \
            'LoongForge/**/.git' \
            'LoongForge/.github' \
            > .dockerignore
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: LoongForge/docker/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_IMAGE }}:${{ needs.validate.outputs.version }}
