name: Workflow Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate workflows
        run: |
          "$(go env GOPATH)/bin/actionlint"
      - name: Validate YAML documents
        run: |
          python -m pip install 'PyYAML==6.0.2'
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              yaml.safe_load(path.read_text())
              print(path)
          PY
      - name: Run CI helper tests
        run: node --test tests/test_ci_helpers.js
      - name: Run CI Python tests
        run: |
          python -m pip install 'pytest==9.1.1'
          # Only the CI-helper tests run here: the rest of tests/ needs torch
          # and accelerator hardware, which this runner does not have.
          python -m pytest -q \
            tests/test_ci_artifacts.py \
            tests/test_ci_command.py \
            tests/test_ci_summary.py \
            tests/test_sensitive_scan.py \
            tests/test_vlm_dataloader_read_order.py
