name: GPU Regression Invalidation

on:
  pull_request_target:
    types: [synchronize]

permissions: {}

jobs:
  invalidate_llm_vlm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: gpu-regression-${{ github.event.pull_request.number }}-llm_vlm
      cancel-in-progress: true
    steps:
      - name: Invalidate stale LLM/VLM work
        run: echo "Cancelled stale LLM/VLM GPU work for this pull request, if any."

  invalidate_embodied:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: gpu-regression-${{ github.event.pull_request.number }}-embodied
      cancel-in-progress: true
    steps:
      - name: Invalidate stale embodied work
        run: echo "Cancelled stale embodied GPU work for this pull request, if any."

  # The two jobs above only exist to steal the suite concurrency groups and
  # cancel in-flight GPU work; both always succeed, so their green ticks say
  # nothing about GPU results. Meanwhile check runs are bound to a commit SHA,
  # so the previous revision's `gpu-regression` check does not become stale —
  # the new head simply has no such check, and GPU validation silently reverts
  # to un-run. Re-publish it as `action_required` on the new head so the pull
  # request shows that this revision still needs `/ok-to-test`.
  require_revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIOUS_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.event.after }}
        with:
          script: |
            // Only pull requests that had already been validated need this
            // marker. GPU validation is opt-in via `/ok-to-test`, so creating
            // the check unconditionally would put a blocking marker on every
            // pull request that never asked for GPU work in the first place.
            const previous = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.PREVIOUS_SHA,
              check_name: 'gpu-regression',
              per_page: 100,
            });
            if (previous.length === 0) {
              console.log('No GPU validation on the previous revision; nothing to invalidate.');
              return;
            }
            // `action_required` rather than `neutral`: neutral counts as a pass
            // for required status checks, which would make this marker
            // toothless the moment branch protection starts enforcing them.
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'gpu-regression',
              head_sha: process.env.CURRENT_SHA,
              external_id: `loongforge-gpu:${process.env.PR_NUMBER}:${process.env.CURRENT_SHA}`,
              status: 'completed',
              conclusion: 'action_required',
              completed_at: new Date().toISOString(),
              output: {
                title: 'GPU validation is out of date',
                summary: [
                  `Revision \`${process.env.PREVIOUS_SHA.slice(0, 12)}\` was validated on GPU;`,
                  `\`${process.env.CURRENT_SHA.slice(0, 12)}\` has not been.`,
                  '',
                  'Comment `/ok-to-test` to revalidate this revision.',
                ].join('\n'),
              },
            });
