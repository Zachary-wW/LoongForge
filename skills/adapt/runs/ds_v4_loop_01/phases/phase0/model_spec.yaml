novel_modules:
  - hf_class: DeepseekV4HCACompressor
    hf_file: modeling_deepseek_v4.py
    hf_line: 362
    desc: "Heavily Compressed Attention compressor (paper 2.3.2). Compresses every compress_rate_hca=128 source tokens into a single compressed KV entry using softmax-gated convex combination with position_bias."

  - hf_class: DeepseekV4CSACompressor
    hf_file: modeling_deepseek_v4.py
    hf_line: 579
    desc: "Compressed Sparse Attention compressor (paper 2.3.1). Compresses every compress_rate_csa=4 source tokens with overlapping Ca/Cb series, runs Lightning Indexer for top-k compressed KV selection."

  - hf_class: DeepseekV4Indexer
    hf_file: modeling_deepseek_v4.py
    hf_line: 448
    desc: "Lightning Indexer (paper 2.3.1, eqs. 13-17). Scores queries against compressed keys with sum_h w*ReLU(q*K), keeps top index_topk=512 entries per query."

  - hf_class: DeepseekV4HyperConnection
    hf_file: modeling_deepseek_v4.py
    hf_line: 864
    desc: "Manifold-Constrained Hyper-Connections (mHC, paper 2.2). Replaces standard residual with hc_mult=4 parallel streams, Sinkhorn-Knopp projection onto doubly-stochastic matrices, pre/post/comb weight decomposition."

  - hf_class: DeepseekV4HyperHead
    hf_file: modeling_deepseek_v4.py
    hf_line: 943
    desc: "Final HC-stream collapse head. Collapses hc_mult=4 parallel streams to single sequence before final norm."

  - hf_class: DeepseekV4HashRouter
    hf_file: modeling_deepseek_v4.py
    hf_line: 1040
    desc: "Hash routing for bootstrap MoE layers (paper 2.1). Expert selection via frozen tid2eid[input_ids] lookup instead of learned argmax."

  - hf_class: DeepseekV4GroupedLinear
    hf_file: modeling_deepseek_v4.py
    hf_line: 303
    desc: "Block-diagonal grouped linear for output projection. Splits num_attention_heads*head_dim into o_groups=8 groups, projects each to o_lora_rank=1024, then mixed by o_b_proj."

  - hf_class: DeepseekV4HCACache
    hf_file: modeling_deepseek_v4.py
    hf_line: 171
    desc: "Cache layer for HCA blocks. Holds sliding-window K=V + running compressed entries with non-overlapping windows."

  - hf_class: DeepseekV4CSACache
    hf_file: modeling_deepseek_v4.py
    hf_line: 255
    desc: "Cache layer for CSA blocks. Extends HCACache with indexer entries and per-name overlap state for two-series window scheme."

  - hf_class: DeepseekV4UnweightedRMSNorm
    hf_file: modeling_deepseek_v4.py
    hf_line: 66
    desc: "Weightless RMSNorm. No learnable weight parameter; output = x * rsqrt(variance + eps)."

behavior_modifications:
  - id: swiglu_clamp_limit
    component: moe_experts
    behavior_type: activation
    source_evidence:
      hf_file: modeling_deepseek_v4.py
      hf_line: 1009
      config_fields: [swiglu_limit]
    required_behavior: "Clamp routed experts' gate and up pre-activations: gate.clamp(max=10.0), up.clamp(min=-10.0, max=10.0) before SiLU*gating. Affects DeepseekV4Experts._apply_gate."
    affected_existing_modules: [moe_experts]
    validation_hint: "Use synthetic inputs exceeding the clamp threshold (gate > 10.0, up > 10.0 or up < -10.0); random initialization is insufficient to expose this behavior."

  - id: scoring_func_sqrtsoftplus
    component: moe_gate
    behavior_type: routing_scoring
    source_evidence:
      hf_file: modeling_deepseek_v4.py
      hf_line: 1026
      config_fields: [scoring_func]
    required_behavior: "Router activation uses sqrtsoftplus scoring function instead of sigmoid or softmax. ACT2FN['sqrtsoftplus'] must be available. Affects both TopKRouter and HashRouter."
    affected_existing_modules: [moe_gate]
    validation_hint: "Verify router scores match sqrt(softplus(logits)) vs sigmoid(logits); discrepancy causes different expert selection and output divergence."

  - id: compress_layer_types_schedule
    component: attention
    behavior_type: attention_schedule
    source_evidence:
      hf_file: configuration_deepseek_v4.py
      hf_line: 260
      config_fields: [compress_ratios, layer_types, compress_rates]
    required_behavior: "Three attention layer types: sliding_attention (compress_ratio=0), compressed_sparse_attention (m=4), heavily_compressed_attention (m'=128). Layer 0-1 are HCA, then interleaved CSA/HCA for the rest. Derived from compress_ratios=[0,0,4,128,4,128,...,0]."
    affected_existing_modules: [attention, decoder_layer]
    validation_hint: "Verify per-layer compressor attachment matches layer_types schedule; wrong compressor type causes shape mismatch and KV concatenation failure."

  - id: hc_manifold_residual
    component: decoder_layer
    behavior_type: residual_connection
    source_evidence:
      hf_file: modeling_deepseek_v4.py
      hf_line: 864
      config_fields: [hc_mult, hc_sinkhorn_iters, hc_eps]
    required_behavior: "Manifold-Constrained Hyper-Connections replace standard residual. Input expanded to [B,S,hc_mult=4,D]. Each sublayer wrapped by attn_hc/ffn_hc producing pre/post/comb weights. comb matrix projected onto doubly-stochastic manifold via Sinkhorn-Knopp (20 iterations). Output = post*sublayer + comb.T @ residual."
    affected_existing_modules: [decoder_layer]
    validation_hint: "Verify Sinkhorn convergence by checking comb row/col sums approach 1.0; test with hc_mult>1 streams to confirm non-trivial mixing."

  - id: partial_rotary_0.125
    component: positional_encoding
    behavior_type: positional_encoding
    source_evidence:
      hf_file: configuration_deepseek_v4.py
      hf_line: 139
      config_fields: [head_dim, qk_rope_head_dim]
    required_behavior: "Partial RoPE: only qk_rope_head_dim=64 out of head_dim=512 gets rotary encoding (factor=0.125). V4 applies interleaved RoPE to the trailing rope slice [nope | rope] layout."
    affected_existing_modules: [positional_encoding, attention]
    validation_hint: "Compare with full-dimension RoPE (rotary_percent=1.0); divergence confirms partial application. Failure pattern from KB: partial_rotary_factor_missed."

  - id: routed_scaling_factor_1.5
    component: moe_gate
    behavior_type: routing_scaling
    source_evidence:
      hf_file: modeling_deepseek_v4.py
      hf_line: 1037
      config_fields: [routed_scaling_factor]
    required_behavior: "Routed expert outputs scaled by routed_scaling_factor=1.5 after normalization. V3 uses different values (2.5 for 256-expert or 1.0 for 64-expert)."
    affected_existing_modules: [moe_gate]
    validation_hint: "Verify routed expert outputs are multiplied by 1.5; mismatch causes logit shift."

  - id: mlp_layer_types_hash_moe
    component: moe_layer
    behavior_type: moe_routing_schedule
    source_evidence:
      hf_file: configuration_deepseek_v4.py
      hf_line: 271
      config_fields: [num_hash_layers, mlp_layer_types]
    required_behavior: "First 3 layers use hash_moe (DeepseekV4HashRouter with tid2eid lookup), remaining layers use standard moe (DeepseekV4TopKRouter). ALL layers are MoE (no dense_first_k unlike V3)."
    affected_existing_modules: [moe_layer]
    validation_hint: "Verify first 3 layers receive input_ids and route via tid2eid; later layers use learned top-k routing."

  - id: dual_rope_theta
    component: positional_encoding
    behavior_type: positional_encoding
    source_evidence:
      hf_file: configuration_deepseek_v4.py
      hf_line: 286
      config_fields: [rope_theta, compress_rope_theta, rope_parameters]
    required_behavior: "Dual RoPE theta: sliding_attention layers use theta=10000 (no scaling); CSA/HCA layers use compress_rope_theta=160000 with yarn factor=16 and attention_factor=1.0 (no mscale scaling)."
    affected_existing_modules: [positional_encoding, attention]
    validation_hint: "Verify that sliding_attention layers get plain RoPE while CSA/HCA layers get yarn-scaled RoPE with theta=160000."

traps:
  - "ALL 43 layers are MoE (no dense_first_k unlike V3 which has 3 dense layers); first 3 are hash_moe bootstrap layers with frozen tid2eid routing"
  - "e_score_correction_bias participates in TopKRouter scoring; this field must be preserved in config and conversion"
  - "MTP absent in HF code is normal -- Omni implements MTP independently via Megatron; checkpoint has mtp.0.* weights"
  - "V4 uses shared-KV MQA (num_key_value_heads=1, K==V); not MLA like V3 which has separate kv_lora_rank compression"
  - "HyperConnection (mHC) changes hidden_states to [B,S,hc_mult,D] shape; every layer and the model must handle this 4D stream layout"
  - "swiglu_limit=10.0 clamps expert gate/up activations; missing this causes numerical divergence in MoE expert outputs"
  - "scoring_func=sqrtsoftplus is NOT sigmoid or softmax; ACT2FN must resolve this new activation function"
  - "V4 is eager-only: no FlashAttention2/3 (head_dim=512 > 256 cap), no SDPA (attention sinks), no FlexAttention (compressor variable KV length)"
  - "compress_ratios in config.json is a legacy field; __post_init__ converts it to layer_types list. New configs may omit compress_ratios and provide layer_types directly"
  - "V4 config attribute_map: num_local_experts reads from n_routed_experts, intermediate_size reads from moe_intermediate_size"
  - "tid2eid buffer in HashRouter is persistent and loaded from checkpoint; must not be zero-initialized for hash_moe layers"
  - "KV identity: key == value in V4 (shared tensor via repeat_kv with n_rep=num_attention_heads); conversion must map single KV head correctly"

special_features:
  routing_bias:
    hf_key: e_score_correction_bias
    desc: "noaux_tc routing load balancing correction bias in TopKRouter; dynamically added to scores before top-k selection"
  hash_routing:
    hf_key: tid2eid
    desc: "Frozen token-id to expert-id lookup table for hash_moe bootstrap layers (first 3 layers); persistent buffer loaded from checkpoint"
  hyper_connection:
    config_key: hc_mult
    desc: "Manifold-Constrained Hyper-Connections replace standard residual; hc_mult=4 parallel streams with Sinkhorn-Knopp projection"
  attention_sink:
    config_key: sinks
    desc: "Per-head learnable attention sink parameter appended to attention logits before softmax"
  grouped_output_proj:
    config_key: o_groups
    desc: "Grouped output projection with o_groups=8 groups, o_lora_rank=1024 intermediate; reduces per-token cost of large head_dim*num_heads output"

